# BOLDistill marker preset: rbcL (plant barcode region)
# Sourced by BOLDistill.sh. See markers/COI-5P.conf for a description of every setting.
#
# BOLD does not assign BINs to rbcL, so every eligible record is clustered into OTUs by vsearch.
# rbcL is far more conserved than COI: congeneric species often share identical sequences, so expect
# many OTUs to resolve only to genus or family. The identity values below are STARTING POINTS to be
# tuned on real data (check how often OTUs mix genera), not established standards.

MARKER_LABEL="rbcL"

# check the marker_code spellings actually present in your boldlist
MARKER_CODES="rbcL rbcLa"

USE_BINS=false

# no rbcL-specific length column in the boldlist: measure the cleaned sequence
LENGTH_COL=""

# rbcLa barcode ~550 bp; full-length rbcL ~1430 bp
MIN_LENGTH=500
MAX_LENGTH=1450

MAX_N=6
OTU_MAX_N=6

# cluster every eligible record (no kingdom/phylum restriction)
OTU_KINGDOMS=""
OTU_PHYLA=""

OTU_ID=0.99
DISTILL_ID=0.998

# unused when USE_BINS=false
OTU_DEDUP_ID=0.95
