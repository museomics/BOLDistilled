# BOLDistill marker preset: COI-5P (the animal DNA barcode region)
# Sourced by BOLDistill.sh. These values reproduce the original COI-only behaviour of the pipeline.
# To add a new marker, copy this file to markers/<name>.conf and edit the values (see markers/rbcL.conf
# for a marker without BINs). The file name (minus .conf) is what appears in the marker menu.

# label used in output file names, e.g. BOLDistilled_COI_May2026
MARKER_LABEL="COI"

# space-separated marker_code values to accept from the boldlist (matched case-insensitively)
MARKER_CODES="COI-5P"

# true  = records that carry a BOLD BIN are grouped by BIN; only BIN-less records are clustered into OTUs
# false = BINs are ignored and every eligible record is clustered into OTUs (use for markers BOLD does not BIN)
USE_BINS=true

# column holding the sequence length; leave empty to measure the cleaned 'nuc' sequence instead
LENGTH_COL="coi_length"

# minimum length for all records; maximum length applies only to records clustered into OTUs
MIN_LENGTH=500
MAX_LENGTH=1600

# maximum number of Ns: MAX_N for BIN records, OTU_MAX_N for OTU-clustered records (empty = no limit)
MAX_N=6
OTU_MAX_N=""

# which records may be clustered into OTUs (space-separated; a record qualifies if its kingdom OR phylum
# is listed). Leave both empty to cluster every eligible record.
OTU_KINGDOMS="Bacteria Fungi Protista"
OTU_PHYLA="Nematoda"

# OTU clustering identity (vsearch --cluster_fast; BIN-analog for records without a BIN)
OTU_ID=0.977

# distillation identity: within each BIN/OTU, sequences at or above this identity to a kept
# representative are dropped. Must be higher (stricter) than OTU_ID.
DISTILL_ID=0.9925

# OTU reps at or above this identity to a BIN rep are dropped as redundant/contaminant (USE_BINS=true only)
OTU_DEDUP_ID=0.95
